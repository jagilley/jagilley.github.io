<body>
<div id="scene" tabindex="0" role="button" aria-label="A present is being drawn in pencil.">
  <canvas id="cv"></canvas>
  <p id="msg" hidden></p>
</div>
<div id="live" class="sr" aria-live="polite"></div>
<button id="replay" aria-label="Draw it all again" title="Again" tabindex="-1"><canvas width="152" height="152"></canvas></button>

<!-- the core: the renderer, the present and the paper world. Everything else loads while the box is drawn. -->
<script src="resources/jaden/pencil.js"></script>
<script src="resources/jaden/box.style.js"></script>
<script src="resources/jaden/bg.style.js"></script>
<script>
/*
 * "For Jaden", hand-drawn: an exposure-sheet engine.
 *
 * Every shot is an exposure sheet: a list of drawings, each a complete pose of the scene held for a whole number of
 * frames at 24 fps (on 1s, 2s or 3s). Nothing is evaluated between drawings: slow-in and slow-out come from where
 * the inbetweens sit on a spacing chart; anticipation, squash and stretch, overshoot, multiples and the impact
 * frame are separate drawings. A held drawing boils through three drawings at 8 fps. Each drawing has its own seed,
 * a hair of registration error and a slightly different amount of colour. Write-ons advance on 1s.
 *
 * Rendering works like cel levels: the paper and background are one cached level per camera and boil seed; the
 * dusk wash is committed pass by pass onto per-seed wash levels; the ball, its halves, the VI and the wordmark are
 * sprites (drawn once per seed, multiplied on through a paper-filled silhouette, so they can squash and turn as
 * blits); the climax drawings are pre-rendered while the ball idles. The canvas changes only when the drawing does.
 *
 * QA: window.__jaden.seekShot(name, t) / seek(t) render the exact drawing at any time (?qa=1 stops the clock).
 * Flags: ?rm=1 reduced motion, ?wo=2 write-ons on 2s, ?logo=official the crisp official logo, ?nocache=1,
 * ?skip=bg,ball,... (timing), ?dpr=N. Tools: jaden-work/tools/anim/capture.mjs, live.mjs.
 */
(() => {
'use strict';
const $ = id => document.getElementById(id);
const scene = $('scene'), cv = $('cv'), live = $('live'), replayBtn = $('replay'), msg = $('msg');
const P = window.Pencil, J = window.JADEN || (window.JADEN = {});
function fail(text) {   // a visible fallback: a short note; a tap reloads
  msg.textContent = text; msg.hidden = false; scene.setAttribute('aria-label', text); live.textContent = text;
  scene.addEventListener('click', () => location.reload(), { once: true });
}
if (!P || !J.box || !J.bg) { fail('The drawing didn’t load. Tap to try again.'); return; }
const ctx = cv.getContext('2d');

const Q = new URLSearchParams(location.search);
const QA = Q.has('qa');
const RM = Q.has('rm') ? Q.get('rm') === '1' : matchMedia('(prefers-reduced-motion: reduce)').matches;
const WO = Q.get('wo') === '2' ? 2 : 1;            // write-ons advance on 1s (default) or on 2s
const OFFICIAL = Q.get('logo') === 'official';    // dev flag: the crisp official mark, for comparison
const NOCACHE = Q.has('nocache');
const SKIP = new Set((Q.get('skip') || '').split(','));
const TOUCH = matchMedia('(pointer: coarse)').matches;
const FPS = 24, COLOR = 0.64;

/* ═══ loading: the rest of the cast arrives while the box is drawn (with retry) ═══════════════════ */
const LATE = { ball: 'ball.style.js', text: 'text.style.js', fx: 'fx.style.js', logoOfficial: 'logo-official.js', logo: 'logo.style.js' };
const loadState = {};   // key -> 'loading' | true | false
const loadWaiters = [];
function loadLate(key, tries) {
  tries = tries || 0;
  loadState[key] = 'loading';
  const s = document.createElement('script');
  s.src = 'resources/jaden/' + LATE[key] + (tries ? '?retry=' + tries : '');
  s.async = true;
  s.onload = () => { loadState[key] = !!J[key]; loadedChanged(); };
  s.onerror = () => {
    s.remove();
    if (tries < 3) setTimeout(() => loadLate(key, tries + 1), 700 * (tries + 1));
    else { loadState[key] = false; loadedChanged(); }
  };
  document.head.appendChild(s);
}
function loadedChanged() { for (const w of loadWaiters.splice(0)) w(); onLoaded(); }
const have = k => loadState[k] === true;
const settled = k => loadState[k] === true || loadState[k] === false;
for (const k in LATE) loadLate(k);

/* ═══ small maths ═══════════════════════════════════════════════════════ */
function hs(s) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  h ^= h >>> 15; h = Math.imul(h, 2246822507); h ^= h >>> 13;
  return h >>> 0;
}
const rnd = (...k) => hs(k.join('|')) / 4294967296;   // deterministic 0..1 from a key
const sym = (...k) => rnd(...k) * 2 - 1;
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const lerp = (a, b, t) => a + (b - a) * t;
const isObj = v => v !== null && typeof v === 'object' && !Array.isArray(v);

/* ═══ exposure sheets ═══════════════════════════════════════════════════
 * A row is one drawing: [frames held, pose]. Poses are written as deltas, merged per actor onto the drawing
 * before. `to()` places inbetweens on a spacing chart. Row options:
 *   still        no boil even if long          held   boil even if short (a hold split into rows)
 *   wo           {path: [from, to, step?, max?]} write-ons inside the row (the end value stays written)
 *   tremble      [a0, a1] the ball shakes on 1s, the amplitude ramping   act / land  hop bookkeeping
 *   pre          pre-render this drawing during the ball idle (the climax) */
function merge(a, b) {
  if (!isObj(b)) return b === undefined ? a : b;
  const o = isObj(a) ? Object.assign({}, a) : {};
  for (const k in b) o[k] = isObj(b[k]) && isObj(o[k]) ? merge(o[k], b[k]) : b[k];
  return o;
}
function mix(a, b, u) {
  if (typeof a === 'number' && typeof b === 'number') return a + (b - a) * u;
  if (isObj(a) && isObj(b)) { const o = Object.assign({}, a); for (const k in b) o[k] = mix(a[k], b[k], u); return o; }
  return b;
}
function setPath(o, path, v) {   // copy-on-write set of a dotted path
  const ks = path.split('.'), root = Object.assign({}, o);
  let cur = root;
  for (let i = 0; i < ks.length - 1; i++) { cur[ks[i]] = Object.assign({}, cur[ks[i]]); cur = cur[ks[i]]; }
  cur[ks[ks.length - 1]] = v;
  return root;
}
class Sheet {
  constructor(base) { this.rows = []; this.cur = base; this.len = 0; }
  d(n, delta, opt) {            // one drawing, held n frames
    this.cur = merge(this.cur, delta || {});
    this.rows.push({ f0: this.len, n, pose: this.cur, opt: opt || {}, i: this.rows.length });
    this.len += n;
    if (opt && opt.wo) for (const k in opt.wo) { const w = opt.wo[k]; this.cur = setPath(this.cur, k, w[3] !== undefined ? Math.min(w[3], w[1]) : w[1]); }
    return this;
  }
  to(delta, chart, n) {         // inbetweens toward a key, one per chart entry, each held n frames
    const A = this.cur, B = merge(A, delta);
    chart.forEach((u, k) => this.d(Array.isArray(n) ? n[k] : n, mix(A, B, u)));
    return this;
  }
  pad3() { const r = this.rows[this.rows.length - 1], x = (3 - this.len % 3) % 3; r.n += x; this.len += x; return this; }   // next row starts on a boil beat
  at(f) {
    const R = this.rows; let lo = 0, hi = R.length - 1;
    while (lo < hi) { const m = (lo + hi + 1) >> 1; if (R[m].f0 <= f) lo = m; else hi = m - 1; }
    return R[lo];
  }
}

/* ═══ the cast: world units (100 = one ruled line on Jasper's paper), ground at y = 0, figures at x = 0 ═══ */
const BOX_A = [420, 783];                    // box body bottom-centre
const BALL_A = [462, 812], BALL_C = [462, 429.2], BALL_R = 403.3;
const BALL_CW = [0, BALL_C[1] - BALL_A[1]];  // the ball's centre in world units
const DUST_Y = 832 - BALL_A[1];              // the dust anchor: the ball's ground contact
const LID_PV = J.box.style.groups.lid.pivot, BOW_PV = J.box.style.groups.bow.pivot;
const SPLIT_ROT = 0.42, SPLIT_REST = 1.22;   // the halves roll open by SPLIT_ROT * split radians
const LOGO_H = 1086, LOGO_REST = { x: 0, y: -650, s: 0.55 };
const LOGO_TOP = LOGO_REST.y - LOGO_H * LOGO_REST.s, LOGO_MID = LOGO_REST.y - LOGO_H * LOGO_REST.s / 2;

// focus boxes in world units. Wide screens fit w x h; portrait keeps width pw (extra height mostly sky); tall
// phones (aspect < 0.62) use `tall`: width pw with the ground at `ground` of the screen height.
const CAM = {
  present: { name: 'present', cx: 0, cy: -520, w: 1600, h: 1500, pw: 1400, bias: 0.62 },
  tight:   { name: 'tight', cx: 0, cy: -400, w: 1150, h: 1000, pw: 1050, bias: 0.55 },
  reveal:  { name: 'reveal', cx: 0, cy: -700, w: 1550, h: 1560, pw: 1400, bias: 0.5, tall: { pw: 1300, ground: 0.78, top: 1500 } },   // the hero's framing
  final:   { name: 'final', cx: 0, cy: -860, w: 1800, h: 2000, pw: 1500, bias: 0.5, tall: { pw: 1300, ground: 0.78, top: 2080 } },   // room for the greeting
};
const BOX0 = { x: 0, y: 0, rot: 0, sx: 1, sy: 1, lid: { x: 0, y: 0, rot: 0, on: 1, fly: 0 }, bow: { x: 0, y: 0, rot: 0, free: 0, on: 1 },
  ground: { a: 1, s: 1 }, rim: 0, lidShadow: 1, build: { line: 1, construct: 1, color: 1, shadow: 1 }, mult: null };
const BALL0 = { x: 0, y: 0, rot: 0, s: 1, sx: 1, sy: 1, on: 1, ground: { a: 1, s: 1 }, crack: 0, split: 0, hop: 0, holes: 0, impact: 0, inBox: 0, front: 0 };
const WORD0 = { on: 1, x: 0, y: 0, scale: 1, sx: 1, sy: 1 };
const LOGO0 = { x: LOGO_REST.x, y: LOGO_REST.y, s: LOGO_REST.s, sx: 1, sy: 1, word: WORD0, ghosts: null };
const TEXT0 = { draw: 1, accent: 1 };
const BG0 = { r: 1, d: 1, dusk: 0 };       // roughs and details sketched in (0..1), dusk-wash beats laid (0..DUSK_N)
const SCENE0 = { cam: CAM.present, shake: [0, 0], bg: BG0, box: null, ball: null, logo: null, text: null, fx: [], impact: 0, rest: 0, replay: 0 };
const REST = { cam: CAM.final, shake: [0, 0], ball: merge(BALL0, { split: SPLIT_REST }), logo: LOGO0, rest: 1 };
const REST_R = Object.assign({}, REST, { cam: CAM.reveal });

const BGJ = J.bg;
const DUSK_N = BGJ.layout && BGJ.layout.duskBeats ? BGJ.layout.duskBeats.length : 40;   // dusk-wash beats on 3s
const BOX_WRITE = 51, TEXT_WRITE = 150;

/* ═══ the storyboard ═══════════════════════════════════════════════════ */
function trailAt(k, i, prev, cur, pv, half) {   // a drawn trail anchored on a flying part's trailing edge, +x along travel
  const dx = cur.x - prev.x, dy = cur.y - prev.y, d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
  const c = Math.cos(cur.rot || 0), sn = Math.sin(cur.rot || 0);
  const ext = Math.abs(ux * c + uy * sn) * half[0] + Math.abs(-ux * sn + uy * c) * half[1];
  const cx = pv[0] - BOX_A[0] + cur.x, cy = pv[1] - BOX_A[1] + cur.y;
  return { k, i, x: cx - ux * ext, y: cy - uy * ext, rot: Math.atan2(uy, ux), back: 1 };
}

function sketchSheet() {
  const s = new Sheet(merge(SCENE0, { bg: { r: 0, d: 0 } }));
  if (RM) {
    s.d(6); s.d(7, { bg: { r: 1 } });
    s.d(7, { box: merge(BOX0, { build: { color: 0, shadow: 0 } }) });
    s.d(7, { box: { build: { color: 1, shadow: 1 } } });
    return s.d(8, { bg: { d: 1 } });
  }
  s.d(8);                                                              // blank paper, a breath
  s.d(21, {}, { wo: { 'bg.r': [0, 1] } });                             // the horizon from the middle out, then the hills
  s.d(3, { box: merge(BOX0, { build: { line: 0, construct: 0, color: 0, shadow: 0 } }) });
  s.d(BOX_WRITE, {}, { wo: { 'box.build.line': [0, 1] } });            // Jasper's lines, in his stroke order, on 1s
  s.d(15, {}, { wo: { 'box.build.construct': [0, 1, 2] } });           // blue construction, its own layer, on 2s
  s.d(39, {}, { wo: { 'box.build.color': [0, 1, 2] } });               // marker passes, laid one or two per drawing
  s.d(15, {}, { wo: { 'box.build.shadow': [0, 1, 2] } });              // red boundaries, hatching, kage, ground
  s.d(33, {}, { wo: { 'bg.d': [0, 1, 2] } });                          // then the background details, as a coda
  return s.d(6);
}

function hop(s) {   // ballistic: quick off the ground, slow over the top (on 3s), quick down; the bow follows through
  s.d(2, { box: { sx: 1.04, sy: 0.94, bow: { rot: 0.03 } } }, { act: 1 });
  s.d(2, { box: { sx: 1.09, sy: 0.88, bow: { rot: 0.07 } } }, { act: 1 });
  s.d(2, { box: { y: -60, sx: 0.93, sy: 1.1, rot: -0.02, bow: { rot: 0.13 }, ground: { s: 0.88, a: 0.82 } } }, { act: 1 });
  s.d(2, { box: { y: -101, sx: 0.97, sy: 1.05, rot: -0.033, bow: { rot: 0.1 }, ground: { s: 0.77, a: 0.7 } } }, { act: 1 });
  s.d(3, { box: { y: -116, sx: 1, sy: 1, rot: -0.03, bow: { rot: 0.02 }, ground: { s: 0.74, a: 0.66 } } }, { act: 1 });
  s.d(3, { box: { y: -106, rot: -0.012, bow: { rot: -0.07 } } }, { act: 1, still: 1 });
  s.d(2, { box: { y: -70, sx: 0.97, sy: 1.05, rot: 0.01, bow: { rot: -0.1 }, ground: { s: 0.8, a: 0.72 } } }, { act: 1 });
  s.d(2, { box: { y: 0, sx: 1.12, sy: 0.85, rot: 0, bow: { rot: -0.17 }, ground: { s: 1.06, a: 1 } } }, { land: 1 });
  s.d(2, { box: { sx: 0.96, sy: 1.05, lid: { y: -7 }, bow: { rot: 0.13 } } });                 // rebound, the lid lifts a hair
  s.d(3, { box: { sx: 1.025, sy: 0.975, lid: { y: 0 }, bow: { rot: -0.07 } } });
  s.d(3, { box: { sx: 1, sy: 1, bow: { rot: 0.03 } } });
  s.d(3, { box: { bow: { rot: 0 } } });
}
function wiggle(s, d) {   // a shuffle on the spot: rock one way, the other, settle; the bow lags
  s.d(2, { box: { rot: -0.03 * d, sx: 1.02, sy: 0.98, bow: { rot: 0.05 * d } } }, { act: 1 });
  s.d(2, { box: { rot: 0.045 * d, y: -5, sx: 0.99, sy: 1.01, bow: { rot: -0.09 * d } } }, { act: 1 });
  s.d(2, { box: { rot: -0.035 * d, y: 0, bow: { rot: 0.08 * d } } }, { act: 1 });
  s.d(2, { box: { rot: 0.02 * d, sx: 1.015, sy: 0.985, bow: { rot: -0.05 * d } } }, { land: 1 });
  s.d(3, { box: { rot: -0.008 * d, sx: 1, sy: 1, bow: { rot: 0.025 * d } } });
  s.d(3, { box: { rot: 0, bow: { rot: 0 } } });
}
function presentSheet() {   // the present waits: holds that boil, a hop a second after it is drawn, then at irregular gaps
  const s = new Sheet(merge(SCENE0, { box: BOX0 }));
  if (RM) return s.d(72);
  s.d(24); hop(s);
  s.d(57); wiggle(s, 1);
  s.d(78); hop(s);
  s.d(51); wiggle(s, -1);
  return s.d(69);
}

function openSheet() {
  const s = new Sheet(merge(SCENE0, { box: merge(BOX0, { bow: { free: 1 } }) }));
  if (RM) {
    s.d(8, { box: { lid: { on: 0 }, bow: { on: 0 }, rim: 1, lidShadow: 0 } });
    return s.d(10, { box: null, ball: BALL0 });
  }
  // anticipation: the box gathers itself and bulges; something too big is inside
  s.d(2, { box: { sx: 1.08, sy: 0.92 } });
  s.d(2, { box: { sx: 1.16, sy: 0.86, lid: { y: 3 }, bow: { rot: -0.08 } } });
  s.d(2, { box: { sx: 1.25, sy: 0.82, lid: { y: 5 }, bow: { rot: -0.12 } } });
  // pop: lid and bow off on two long arcs (ghost re-drawings on the pop, drawn trails behind on the next two)
  const LP = [{ x: 0, y: 0, rot: 0 }, { x: -40, y: -170, rot: -0.14 }, { x: -250, y: -330, rot: -0.48 }, { x: -560, y: -390, rot: -0.95 },
    { x: -930, y: -340, rot: -1.45 }, { x: -1400, y: -230, rot: -1.9 }, { x: -1950, y: -90, rot: -2.4 }, { x: -2550, y: 80, rot: -2.9 }];
  const BP = [{ x: 0, y: 0, rot: -0.12 }, { x: 70, y: -250, rot: 0.32 }, { x: 270, y: -430, rot: 1.05 }, { x: 500, y: -560, rot: 1.9 },
    { x: 760, y: -640, rot: 2.8 }, { x: 1080, y: -700, rot: 3.6 }, { x: 1550, y: -720, rot: 4.4 }, { x: 2150, y: -700, rot: 5.2 }];
  const ghosts = k => [
    Object.assign({ g: 'lid', a: 0.4 }, mix(LP[k], LP[k - 1], 1 / 3)), Object.assign({ g: 'lid', a: 0.2 }, mix(LP[k], LP[k - 1], 2 / 3)),
    Object.assign({ g: 'bow', a: 0.4 }, mix(BP[k], BP[k - 1], 1 / 3)), Object.assign({ g: 'bow', a: 0.2 }, mix(BP[k], BP[k - 1], 2 / 3))];
  const trails = (k, i) => [trailAt('trailLid', i, LP[k - 1], LP[k], LID_PV, [380, 50]), trailAt('trailBow', i, BP[k - 1], BP[k], BOW_PV, [120, 110])];
  const up = (y, len) => ({ k: 'speed', x: 0, y, i: 0, len, dir: 1 });
  s.d(2, { box: { sx: 1.12, sy: 1.08, rim: 1, lidShadow: 0.3, lid: Object.assign({ fly: 1 }, LP[1]), bow: BP[1], mult: ghosts(1) } }, { pre: 0 });
  // the ball comes up: pinched by the rim, the box bulging round it
  s.d(2, { box: { sx: 1.26, sy: 0.96, lidShadow: 0, lid: LP[2], bow: BP[2], mult: null }, fx: trails(2, 0),
    ball: merge(BALL0, { y: 150, sx: 0.8, sy: 1.12, inBox: 1, ground: { a: 0 } }) }, { pre: 0 });
  s.d(2, { box: { sx: 1.22, sy: 0.92, lid: LP[3], bow: BP[3] }, fx: trails(3, 1), ball: { y: -235, sx: 0.72, sy: 1.28 } }, { pre: 0 });
  // out: it pops round, full size, far too big for the box; the box squashes down under it
  s.d(2, { box: { sx: 1.06, sy: 0.8, lid: LP[4], bow: BP[4] }, ball: { y: -385, s: 1.08, sx: 1.08, sy: 0.93, inBox: 0, front: 1 }, fx: [up(-385, 330)] });
  // it hangs in the air (on 3s) while the box scoots out under it
  s.d(3, { box: { x: 140, y: -40, sx: 0.92, sy: 1.08, rot: 0.06, lid: LP[5], bow: BP[5], ground: { a: 0.7, s: 0.9 } }, ball: { y: -388, s: 1.06, sx: 0.98, sy: 1.03 }, fx: [] });
  s.d(3, { box: { x: 520, y: -110, sx: 1, sy: 1, rot: 0.22, lid: LP[6], bow: BP[6], ground: { a: 0 } }, ball: { y: -398, s: 1.05, sx: 1, sy: 1 } });
  s.d(3, { box: { x: 1000, y: -70, rot: 0.43, lid: LP[7], bow: BP[7] }, ball: { y: -400, s: 1.04 } });
  s.d(3, { box: { x: 1560, y: 30, rot: 0.62, lid: { on: 0 }, bow: { on: 0 } }, ball: { y: -392, s: 1.03, ground: { a: 0.4, s: 0.6 } } });
  // the drop: accelerating, stretched, then contact
  s.d(2, { box: { x: 2150, y: 160, rot: 0.8 }, ball: { y: -360, s: 1.02, sx: 0.98, sy: 1.03, ground: { a: 0.6, s: 0.72 } } });

/* ═══ FX ═══════════════════════════════════════════════════════════════ */

/* ═══ QA bookkeeping: how many of a shot's drawings were actually shown ═══ */

  get drops() { closeVisit(); return visits; },
  get drawing() { return lastD && { shot: lastD.shot, id: lastD.id, key: lastD.key, seed: lastD.seed, pose: lastD.pose }; },
  bench(name, t, n, cold) {   // render cost of one drawing (ms), averaged over n renders with one readback
    n = n || 6;
    const D = drawingAt(name, t, {});
    render(D); ctx.getImageData(0, 0, 1, 1);
    const t0 = performance.now();
    for (let i = 0; i < n; i++) { if (cold) { BASES.clear(); WASH.clear(); SPR.clear(); COMPS.clear(); } render(D); }
    ctx.getImageData(0, 0, 1, 1);
    lastKey = '';
    return (performance.now() - t0) / n;
  },
  seekShot(name, t, opts) {
    if (!BUILD[name]) throw new Error('no shot ' + name + '; shots: ' + ORDER.join(', '));
    running = false; state = name; clock = t;
    lastKey = ''; seeking = true;
    let D;
    try { D = show(name, t, opts || {}); } finally { seeking = false; }
    return { shot: name, t, id: D.id, seed: D.seed, ms: lastMs };
  },
  seek(t) {
    let s = timeline()[0];
    for (const x of timeline()) if (t >= x.start) s = x;
    return this.seekShot(s.name, Math.max(0, t - s.start));
  },
  play() { if (!running) { running = true; lastNow = 0; requestAnimationFrame(tick); } },
  pause() { running = false; },
  tap(x, y) { advance(x === undefined ? null : { clientX: x, clientY: y }); },
};
let officialReady = false;
const officialWait = setInterval(() => { if (J.logoOfficial) { clearInterval(officialWait); J.logoOfficial.ready.then(() => { officialReady = true; lastKey = ''; }); } }, 50);

if (QA) { show('sketch', 0); return; }
// first paper, then the present's figure (the one thing needed in the first second), then the clock
paperOnly(camera(CAM.present));
setTimeout(() => {
  warmFig(J.box, camera(CAM.present).k);
  queueJobs(); runJobs();
  enter('sketch');
  window.__jaden.play();
  scene.focus({ preventScroll: true });
}, 0);
})();
</script>
