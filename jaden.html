<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f3c9a3; }
  body { -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  #scene { position: fixed; inset: 0; cursor: pointer; outline: none; overflow: hidden; }
  #scene.done { cursor: default; }
  .layer, #fx { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #world { visibility: hidden; }   /* an invisible scene graph: the animations drive it, the canvas paints it */
  canvas.layer, #fx { pointer-events: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; display: none;
    background: radial-gradient(circle at var(--fx, 50%) var(--fy, 62%), rgba(255,250,232,1) 0, rgba(255,226,206,.75) 18%, rgba(255,190,220,.25) 42%, rgba(255,190,220,0) 70%); }
  #veil { position: fixed; inset: 0; background: #fff3e2; pointer-events: none; animation: veil 1.8s ease-out .15s forwards; }   /* CSS, so it lifts even if a script fails */
  @keyframes veil { to { opacity: 0; visibility: hidden; } }
  @media (prefers-reduced-motion: reduce) { #veil { animation-duration: .4s; } }
  #replay { position: fixed; right: max(18px, env(safe-area-inset-right)); bottom: max(18px, env(safe-area-inset-bottom));
    width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; display: grid; place-items: center;
    background: rgba(34,16,52,.55); color: #fff8ee; box-shadow: 0 0 0 1.5px rgba(255,248,238,.28); cursor: pointer; opacity: 0; pointer-events: none; visibility: hidden;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); transition: opacity 1.2s ease, background .3s ease, transform .3s ease, visibility 0s; }
  #replay.on { opacity: .7; pointer-events: auto; visibility: visible; }
  #replay:hover { background: rgba(34,16,52,.55); opacity: 1; transform: rotate(-30deg); }
  #replay:focus-visible { outline: 2px solid #fff8ee; outline-offset: 3px; opacity: 1; }

  /* scene palette: every colour below reads a variable that applyDusk() moves from golden hour to Vice City dusk */
  .s0 { stop-color: var(--sky0) } .s1 { stop-color: var(--sky1) } .s2 { stop-color: var(--sky2) }
  .s3 { stop-color: var(--sky3) } .s4 { stop-color: var(--sky4) }
  .sg { stop-color: var(--sunGlow) }
  .pH { stop-color: var(--clHi) } .pM { stop-color: var(--clMid) } .pS, .cshS { stop-color: var(--clSh) }
  .hz { stop-color: var(--haze) } .hf { fill: var(--hillFar) } .hm { fill: var(--hillMid) }
  .tr { fill: var(--tree) } .trf { fill: var(--treeFar) } .mlS { stop-color: var(--meadowLight) }
  .m0 { stop-color: var(--meadow0) } .m1 { stop-color: var(--meadow1) } .m2 { stop-color: var(--meadow2) }
  .gA { fill: var(--grassA) } .gB { fill: var(--grassB) } .gT { fill: var(--grassTip) }
  .fb .ttl { font-family: Georgia, 'Times New Roman', serif; font-variation-settings: normal; }   /* font never arrived: commit to the fallback */
  .ttl { font-family: 'Fraunces', Georgia, serif; font-style: italic; font-weight: 700;
    font-variation-settings: 'SOFT' 100, 'WONK' 1, 'opsz' 144; fill: #fff7ea; }

    const mt = lm(E.titleBob).multiply(lm(titleG));
    for (const pass of ['outline', 'fill']) for (const t of letters) {
      const o = op(t), sp = t.__spr; if (o <= 0 || !sp) continue;
      setM(mt.multiply(lm(t))); C.globalAlpha = o;
      C.drawImage(sp[pass], +t.getAttribute('x') - sp.l, +t.getAttribute('y') - sp.a, sp.w, sp.h);
    }
    C.globalAlpha = 1;
  }
  // in front: the torn paper, the near grass, sparkles, then the vignette and grain
  if (tearing && paperImg) drawShards(C);
  drawTufts(C, tuftsF);
  drawLayer(C, true);
  drawOverlay(C);
}

/* ═══ the frame loop: wind through the grass, torn paper, rays, particles ═══ */
const wind = { gust: 0 };
let T = 0, tearing = false, tearT = 0;
let lowFx = false, ftAcc = 0, ftN = 0, raysOn = false;
function frame(time, deltaMs) {
  const dt = Math.min(.05, deltaMs / 1000); T += dt;
  const amp = RM ? .4 : 1;
  // a slow device keeps fewer motes about
  if (!lowFx && T > 1.5) { ftAcc += deltaMs; if (++ftN === 90) { lowFx = ftAcc / ftN > 40; ftAcc = ftN = 0; } }   // under ~25 fps (a 30 Hz cap is fine)
  updateParticles(dt);
  if (spriteQueue.length) letterSprite(spriteQueue.shift());
  if (tearing) updateShards(dt);
  if (raysOn) rays.a += dt * 4 * amp * rays.spin;
  render();
}
function updateShards(dt) {
  tearT += dt; let alive = 0;
  for (const s of shards) {
    if (s.done) continue; alive++;
    const u = tearT - s.delay;
    if (u < 0) { const j = Math.max(0, .12 + u) * 10; s.x = R(-j, j); s.y = R(-j, j); continue; }   // a shiver before it lets go
    s.x = s.vx0 * u + .5 * s.ax * u * u; s.y = s.vy0 * u + .5 * s.ay * u * u + s.A * Math.sin(s.w * u);
    s.a = s.va * u + .5 * s.aa * u * u; s.flip = Math.cos(s.fr * u); s.sy = 1 - .14 * Math.sin(s.fr * .7 * u);
    s.o = u > 1.25 ? Math.max(0, 1 - (u - 1.25) / .65) : 1;
    if (s.o <= 0) s.done = true;
  }
  if (!alive) tearing = false;
}

/* ═══ choreography ═══════════════════════════════════════════════════ */
let state = 'intro', hopTL, ballTL, ballSince = 0, titleReady = null;
const titleG = $('title');
const letters = [];
const FONT = "italic 700 64px 'Fraunces'";
const fontNow = () => (document.fonts ? Promise.race([document.fonts.load(FONT, 'HapyBirthdJen!'), new Promise(r => setTimeout(r, 1500))]) : Promise.resolve()).catch(() => {});
function buildTitle() {
  if (letters.length) return;
  const lines = [{ txt: 'Happy Birthday', y: 168, fs: 66 }, { txt: 'Jaden!!!', y: 286, fs: 106 }];
  for (const L of lines) {
    const m = mk('text', { x: 0, y: L.y, class: 'ttl', 'font-size': L.fs }, titleG); m.textContent = L.txt;
    const w = m.getComputedTextLength(), x0 = 800 - w / 2, xs = [];
    for (let i = 0; i < L.txt.length; i++) xs.push(m.getStartPositionOfChar(i).x);
    m.remove(); titleW = Math.max(titleW, w + 20);
    for (let i = 0; i < L.txt.length; i++) {
      if (L.txt[i] === ' ') continue;
      const t = mk('text', { x: f1(x0 + xs[i]), y: L.y, class: 'ttl', 'font-size': L.fs }, titleG); t.textContent = L.txt[i]; letters.push(t);
    }
  }
  spriteQueue.push(...letters);   // their sprites are made one per frame (see letterSprite) during the crack
  applyCam();
}
// each letter's outline (with its soft shadow) and fill, rasterised once: the pop-in then only stamps sprites
const spriteQueue = [];
function letterSprite(t) {
  const fam = titleG.classList.contains('fb') ? "Georgia, 'Times New Roman', serif" : "'Fraunces', Georgia, serif", S = 2.6, pad = 12;
  {
    const fs = +t.getAttribute('font-size'), ch = t.textContent, font = `italic 700 ${fs}px ${fam}`;
    const g0 = document.createElement('canvas').getContext('2d'); g0.font = font; const m = g0.measureText(ch);
    const l = Math.ceil(m.actualBoundingBoxLeft) + pad, r = Math.ceil(m.actualBoundingBoxRight) + pad, a = Math.ceil(m.actualBoundingBoxAscent) + pad, d = Math.ceil(m.actualBoundingBoxDescent) + pad + 6;
    const make = paint => { const c = document.createElement('canvas'); c.width = Math.ceil((l + r) * S); c.height = Math.ceil((a + d) * S); const g = c.getContext('2d'); g.scale(S, S); g.translate(l, a); g.font = font; g.lineJoin = 'round'; paint(g); return c; };
    t.__spr = { l, a, w: l + r, h: a + d,
      outline: make(g => { g.strokeStyle = 'rgba(38,6,47,.36)'; g.lineWidth = 14; g.strokeText(ch, 0, 6); g.strokeStyle = '#4b1659'; g.lineWidth = 6.8; g.strokeText(ch, 0, 0); }),
      fill: make(g => { g.fillStyle = '#fff7ea'; g.fillText(ch, 0, 0); }) };
    warm.push(t.__spr.outline, t.__spr.fill);
  }
}

function startHop() {
  if (RM) return;
  const o = { svgOrigin: '800 900' }, b = { svgOrigin: '800 632' }, so = { svgOrigin: '800 904' };
  hopTL = gsap.timeline({ repeat: -1, repeatDelay: 2.1, delay: 2.2 })
    .to('#presentWrap', { ...o, scaleX: 1.05, scaleY: .93, duration: .14, ease: 'power2.out' })
    .to('#presentWrap', { ...o, scaleX: .97, scaleY: 1.05, y: -34, rotation: -3, duration: .22, ease: 'power2.out' })
    .to('#presentShadow', { ...so, scaleX: .8, opacity: .55, duration: .22, ease: 'power2.out' }, '<')
    .to('#bow', { ...b, rotation: -7, duration: .22, ease: 'power2.out' }, '<')
    .to('#presentWrap', { ...o, scaleX: 1, scaleY: 1, y: 0, rotation: 1.5, duration: .2, ease: 'power2.in' })
    .to('#presentShadow', { ...so, scaleX: 1, opacity: 1, duration: .2, ease: 'power2.in' }, '<')
    .to('#bow', { ...b, rotation: 6, duration: .2, ease: 'sine.inOut' }, '<')
    .to('#presentWrap', { ...o, scaleX: 1.05, scaleY: .94, rotation: 0, duration: .07, ease: 'power1.out' })
    .to('#presentWrap', { ...o, scaleX: 1, scaleY: 1, duration: .55, ease: 'elastic.out(1,.35)' })
    .to('#bow', { ...b, rotation: 0, duration: .9, ease: 'elastic.out(1.2,.3)' }, '<');
}

function shake(px) {
  if (RM) return;
  const k = vb.w / VW;   // px on screen -> world units
  gsap.fromTo(shakeOff, { x: 0, y: 0 }, { keyframes: { x: [0, -px * k, px * k * .8, -px * k * .5, px * k * .3, 0], y: [0, px * k * .6, -px * k * .5, px * k * .3, -px * k * .2, 0] }, duration: .4, ease: 'none', onUpdate: applyCam });
}
function toScreen(x, y) { return [((x - vb.x) / vb.w * 100).toFixed(1) + '%', ((y - vb.y) / vb.h * 100).toFixed(1) + '%']; }

function openPresent() {
  state = 'opening';
  if (hopTL) hopTL.kill();
  scene.setAttribute('aria-label', 'The wind takes the wrapping paper away.'); say('The wind takes the wrapping paper away. Inside is a bowling ball.');
  if (RM) {
    $('ball').style.visibility = ''; gsap.set('#ball', { y: 0 });
    gsap.timeline().to('#presentWrap, #presentShadow', { opacity: 0, duration: .7 }, 0).to('#ballShadow', { opacity: 1, duration: .7 }, 0)
      .add(() => { state = 'ball'; ballSince = performance.now(); scene.setAttribute('aria-label', 'A bowling ball. Press to open it.'); startBallIdle(); }, .8);
    return;
  }
  const o = { svgOrigin: '800 900' };
  const tl = gsap.timeline();
  tl.to('#presentWrap', { ...o, scaleX: 1.08, scaleY: .9, y: 0, rotation: 0, duration: .16, ease: 'power2.out' }, 0)
    .to('#presentShadow', { scaleX: 1, opacity: 1, duration: .16, svgOrigin: '800 904' }, 0)
    .to('#bow', { rotation: 0, scale: 1.22, duration: .16, ease: 'back.out(3)', svgOrigin: '800 632' }, 0)
    .to('#presentWrap', { ...o, scaleX: .97, scaleY: 1.04, duration: .14, ease: 'power2.out' })
    .to('#presentWrap', { ...o, scaleX: 1, scaleY: 1, duration: .18, ease: 'power1.inOut' })
    .addLabel('gust', .3)
    .to('#bow', { y: -430, duration: 1.7, ease: 'power1.out', svgOrigin: '800 632' }, 'gust')
    .to('#bow', { x: 700, rotation: 380, scale: .8, duration: 1.7, ease: 'power2.in', svgOrigin: '800 632' }, 'gust')
    .to('#bow', { opacity: 0, duration: .42, ease: 'power1.in', onComplete: () => { $('bow').style.display = 'none'; } }, 'gust+=.38')
    .to(wind, { gust: 1, duration: .55, ease: 'power2.in' }, 'gust')
    .add(() => gustPetals(RM ? 10 : 46), 'gust')
    .add(() => { $('ball').style.visibility = ''; if (paperImg) { const t = $('presentWrap').transform.baseVal.consolidate(); paperM = t && t.matrix; tearT = 0; tearing = true; $('paperIntact').style.display = 'none'; } else gsap.to('#paperIntact', { opacity: 0, duration: .8 }); }, 'gust+=.32')
    .to('#presentShadow', { opacity: 0, duration: 1.2 }, 'gust+=.6')
    .to('#ballShadow', { opacity: 1, duration: 1.2 }, 'gust+=.7')
    .to('#ball', { y: 0, duration: .55, ease: 'bounce.out' }, 'gust+=1.75')
    .add(() => { shake(5); dust(800, 900, RM ? 4 : 16); }, 'gust+=1.92')
    .to(wind, { gust: 0, duration: 2.6, ease: 'sine.inOut' }, 'gust+=1.8')
    .add(() => { state = 'ball'; ballSince = performance.now(); scene.setAttribute('aria-label', 'A bowling ball. Press to open it.'); startBallIdle(); }, 'gust+=2.4');
}

// the greeting is measured and its letter sprites made while the ball sits waiting, not during the reveal
function prepTitle() {
  if (!titleReady) titleReady = fontNow().then(() => { if (document.fonts && !document.fonts.check(FONT, 'HapyBirthdJen!')) titleG.classList.add('fb'); buildTitle(); gsap.set(letters, { opacity: 0 }); });
  return titleReady;
}
function startBallIdle() {
  setTimeout(prepTitle, 700);
  ballTL = gsap.timeline({ repeat: -1, repeatDelay: 1.9, delay: .5 })
    .to('.hglow', { opacity: .45, duration: .45, ease: 'sine.out' })
    .to('#ball', { keyframes: { x: [0, -3, 3, -2.5, 2, -1, 0] }, duration: .42, ease: 'none' }, '<.15')
    .to('.hglow', { opacity: .06, duration: 1.4, ease: 'sine.inOut' });
}

function crackBall() {
  state = 'cracking';
  if (ballTL) ballTL.kill();
  scene.setAttribute('aria-label', 'The bowling ball cracks open.'); say('The bowling ball cracks open…');
  prepTitle();
  raysOn = true;
  const B = '#ball', o = { svgOrigin: '800 900' };
  const draw = (sel, dur, at, ease, stagger) => svg.querySelectorAll(sel).forEach((el, i) => {
    const p = { v: 1 };
    tl.to(p, { v: 0, duration: dur, ease, onUpdate: () => el.setAttribute('stroke-dashoffset', p.v.toFixed(4)) }, at + (stagger ? (i % 4) * stagger : 0));
  });
  const tl = gsap.timeline();
  if (RM) { gsap.set(B, { x: 0 }); tl.to('.hglow', { opacity: 1, duration: .2 }, 0).to(rays, { o: .5, duration: .6 }, .2).add(split, .9); draw('.ckm', .4, .1, 'none'); draw('.ckb', .15, .4, 'none', .05); return; }
  tl.to(B, { ...o, x: 0, rotation: 0, scaleX: 1.07, scaleY: .93, duration: .1, ease: 'power2.out' }, 0)
    .to(B, { ...o, scaleX: 1, scaleY: 1, duration: .45, ease: 'elastic.out(1,.4)' }, .1)
    .to('.hglow', { opacity: 1, duration: .12 }, 0)
    .to(B, { ...o, keyframes: { rotation: [0, -1.6, 1.6, -1.8, 1.8, -2, 2, 0] }, duration: .55, ease: 'none' }, .2)
    .to(B, { ...o, keyframes: { x: [0, -2.5, 2.5, -2.5, 2.5, -2, 2, -2.5, 2.5, -1.5, 0] }, duration: .3, ease: 'none' }, .75)
    .to(B, { ...o, scaleX: 1.035, scaleY: 1.035, duration: .2, ease: 'power2.out' }, 1.02)
    .to(rays, { o: .5, duration: .7 }, .35)
    .to(rays, { s: .85, duration: .7 }, .35)
    .to(svg.querySelectorAll('.ckg'), { attr: { 'stroke-width': 4.2 }, duration: .2, ease: 'power2.in' }, .95)
    .add(split, 1.2);
  draw('.ckm', .42, .2, 'power1.in');
  draw('.ckb', .14, .5, 'power1.out', .09);
}

function split() {
  $('ballWhole').style.display = 'none';
  $('halfL').style.display = ''; $('halfR').style.display = '';
  gsap.to('#ball', { scaleX: 1, scaleY: 1, x: 0, rotation: 0, duration: .35, ease: 'power2.out', svgOrigin: '800 900' });
  $('crack').style.display = 'none';   // the seam's light hands over to the glowing cut faces
  gsap.set('#halfL', { rotation: 7, x: -11, svgOrigin: '800 792' }); gsap.set('#halfR', { rotation: -7, x: 11, svgOrigin: '800 792' });
  gsap.set(svg.querySelectorAll('#halfL .inner, #halfR .inner'), { attr: { rx: 6 } });
  const [fx, fy] = toScreen(800, 792);
  $('flash').style.setProperty('--fx', fx); $('flash').style.setProperty('--fy', fy);
  $('flash').style.display = 'block';
  gsap.timeline().to('#flash', { opacity: RM ? .12 : .18, duration: .04 }).to('#flash', { opacity: 0, duration: .1, ease: 'power2.out', onComplete: () => { $('flash').style.display = 'none'; } });
  gsap.timeline().to('#bloom', { opacity: 1, duration: .08 }).to('#bloom', { opacity: .45, duration: 1.4, ease: 'power2.out' });
  shake(8);
  setTimeout(() => burst(800, 780, RM ? 20 : 80, 1.25), 40);
  const roll = RM ? (sel, dir) => gsap.set(sel, { rotation: -40 * dir, x: -75 * dir, svgOrigin: '800 792' }) : (sel, dir) => gsap.timeline()
    .to(sel, { rotation: -46 * dir, x: -87 * dir, duration: .5, ease: 'power3.out', svgOrigin: '800 792' })
    .to(sel, { rotation: -34 * dir, x: -64 * dir, duration: .45, ease: 'sine.inOut' })
    .to(sel, { rotation: -40 * dir, x: -75 * dir, duration: .55, ease: 'sine.inOut' });
  roll('#halfL', 1); roll('#halfR', -1);
  gsap.to(svg.querySelectorAll('#halfL .inner, #halfR .inner'), { attr: { rx: 24 }, duration: .6, ease: 'power2.out' });
  gsap.to('#ballShadow', { scaleX: 1.9, opacity: .8, svgOrigin: '800 902', duration: .6 });
  gsap.to('#groundGlow', { opacity: 1, duration: .5 });
  gsap.to('.hglow', { opacity: .35, duration: 1.2 });
  gsap.to(rays, { o: .9, duration: .4 });

  // the logo rises out of the light from behind the halves; then the wordmark slams down onto it
  const tl = gsap.timeline({ delay: .06 });
  const logo = $('logo'), word = $('logoWord'), wb = word.getBBox(), wc = [wb.x + wb.width / 2, wb.y + wb.height / 2];
  const L = { y: 276, s: .14, kx: 1, ky: 1, o: 1, ws: 1.45, wo: 0 };
  const drawLogo = () => {
    logo.setAttribute('transform', `translate(800 ${f1(516 + L.y)}) scale(${L.s.toFixed(4)}) translate(0 163) scale(${L.kx.toFixed(4)} ${L.ky.toFixed(4)}) translate(-800 -679)`);
    logo.setAttribute('opacity', L.o.toFixed(3));
    word.setAttribute('transform', `translate(${f1(wc[0])} ${f1(wc[1])}) scale(${L.ws.toFixed(4)}) translate(${f1(-wc[0])} ${f1(-wc[1])})`);
    word.setAttribute('opacity', L.wo.toFixed(3));
  };
  if (RM) { L.y = 0; L.s = 1; L.ws = 1; L.o = 0; }   // reduced motion: everything fades in place
  drawLogo();
  tl.to(L, { y: 0, s: 1, duration: 1.7, ease: 'expo.out', onUpdate: drawLogo }, 0)
    .to(L, { o: 1, duration: RM ? .8 : 0, ease: 'none', onUpdate: drawLogo }, 0)
    .to(rays, { y: 516, s: 1.25, duration: 1.7, ease: 'expo.out' }, 0)
    .to(L, { wo: 1, duration: RM ? .5 : 0, ease: 'none', onUpdate: drawLogo }, .85)
    .to(L, { ws: 1, duration: .26, ease: 'power2.in', onUpdate: drawLogo }, .85)
    .to(L, { kx: 1.07, ky: .91, duration: .07, ease: 'power2.out', onUpdate: drawLogo }, 1.11)
    .to(L, { kx: 1, ky: 1, duration: .5, ease: 'elastic.out(1,.35)', onUpdate: drawLogo }, 1.18)
    .add(() => { shake(3); ring(800, 516, 255, 200); }, 1.11)
    .to(dusk, { t: 1, duration: 3.4, ease: 'sine.inOut', onUpdate: applyDusk }, .1)
    .to(sun, { cy: 726, duration: 3.4, ease: 'sine.inOut' }, .1)   // the sun sets behind the hills
    .to(clouds[2], { x: 330, duration: 2.3, ease: 'power1.in' }, 0)   // and the cloud behind the greeting is blown aside
    .to(clouds[2], { opacity: 0, duration: .7, ease: 'power1.in' }, 1.6)
    .to(cam, { x: CAM1.x, y: CAM1.y, w: CAM1.w, h: CAM1.h, duration: RM ? .01 : 3.2, ease: 'power2.inOut', onUpdate: applyCam }, .1)
    .to(rays, { o: .7, duration: 2 }, 1.6)
    .add(showTitle, 2.3)
    .add(() => {
      state = 'final'; scene.classList.add('done'); ambientPetals = true;
      scene.setAttribute('aria-label', 'Happy Birthday Jaden!!! The bowling ball has opened, and inside it is the Grand Theft Auto VI logo.');
      say('Inside the bowling ball: Grand Theft Auto VI. Happy Birthday Jaden!!!');
      // the resting state stays light: the logo and greeting float gently and the rays settle to stillness
      if (!RM) gsap.to('#logoBob', { y: -9, duration: 2.6, ease: 'sine.inOut', yoyo: true, repeat: -1 });
      gsap.to(rays, { spin: 0, duration: 3, ease: 'sine.out', onComplete: () => { raysOn = false; } });
    }, 3.4)
    .add(() => { const b = $('replay'); b.classList.add('on'); b.tabIndex = 0; }, 6.5);
}

function showTitle() {
  (titleReady || Promise.resolve()).then(() => {
    titleG.style.visibility = 'visible';
    gsap.to(letters, { opacity: 1, duration: RM ? .5 : .001, ease: 'none', stagger: .05 });
    if (!RM) gsap.from(letters, { y: 34, scale: .4, rotation: () => R(-16, 16), transformOrigin: '50% 80%', duration: .8, ease: 'back.out(2.4)', stagger: .05,
      onComplete: () => gsap.to('#titleBob', { y: -5, duration: 2.2, ease: 'sine.inOut', yoyo: true, repeat: -1 }) });
  });
}

function advance(e) {
  if (state === 'present' || state === 'intro') openPresent();
  else if (state === 'ball') { if (performance.now() - ballSince > 700) crackBall(); }   // rapid taps can't skip the ball
  else if (state === 'final' && e && e.clientX !== undefined) {
    const r = scene.getBoundingClientRect(), x = vb.x + (e.clientX - r.left) / VW * vb.w, y = vb.y + (e.clientY - r.top) / VH * vb.h;
    burst(x, y, RM ? 8 : 26, 3.14, .55, true);
  }
}
scene.addEventListener('pointerdown', e => { if (e.button === 0 || e.pointerType !== 'mouse') advance(e); });
scene.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); advance(); } });
$('replay').addEventListener('click', e => { e.stopPropagation(); location.reload(); });

/* ═══ go ═════════════════════════════════════════════════════════════ */
function resize() { VW = scene.clientWidth || innerWidth; VH = scene.clientHeight || innerHeight; sizeCanvas(); applyCam(); }
if (window.ResizeObserver) new ResizeObserver(resize).observe(scene); else addEventListener('resize', resize);
resize();
gsap.set('#ball', { y: -6 });
for (let i = 0; i < 14 && !RM; i++) spawnMote(true);
gsap.ticker.add(frame);
gsap.to(cam, { y: CAM0.y, h: CAM0.h, duration: RM ? .01 : 2.8, ease: 'power2.inOut', onUpdate: applyCam, onComplete: () => { if (state === 'intro') state = 'present'; } });
startHop();
scene.focus({ preventScroll: true });
window.__gift = { open: openPresent, crack: crackBall, get state() { return state; } };
})();
