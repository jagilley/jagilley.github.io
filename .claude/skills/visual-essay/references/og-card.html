<!doctype html>
<!-- ═══════════════════════════════════════════════════════════════════════════
     SHARE CARD (OG image) TEMPLATE — current skin — a standalone 1200×630 reproduction of the
     hero: kicker, title, subtitle, hero glyph, byline on the slate800 ground
     with the accent's radial glow. Same recipe as the scrolldeck skill's step 7.

     1. Replace the TODOs and the two placeholders:
          __LATEX_CSS__  → the page's stylesheet as localized by qa_copy.py
                           (<qa-dir>/assets/<host>_<path>.css), so the title's
                           font renders without waiting on the CDN
          __HERO_SVG__   → the hero <svg> from the page (the QA-fixed version),
                           with class="glyph" added to its <svg> tag
        Leave the anim-* classes undefined here so everything renders at its
        final, fully visible state.
     2. Render through the harness (a plain --screenshot hangs on the CDN fonts):
          { "file": "/abs/og.render.html", "width": 1200, "height": 630, "dpr": 2,
            "settle": 2500, "jobs": [ { "out": "/abs/og-2x.png", "wait": 800,
            "clip": [0, 0, 1200, 630] } ] }
     3. Downsample 2400×1260 → 1200×630 with PIL (LANCZOS) and save to
          resources/<slug>-og.png
        then add og:image (+ width/height/alt) and twitter:image to the page.
     Mirror the current hero wording; re-render if the hero changes.
     ═══════════════════════════════════════════════════════════════════════════ -->
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="__LATEX_CSS__">
<style>
  :root{ --accent:#7C3AED; --accent300:#C4B5FD; --slate200:#E2E8F0; --slate800:#1E293B; --grayout:#9CA3AF; --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,sans-serif; }
  html,body{ margin:0; padding:0; background:var(--slate800); }
  body{ width:1200px; height:630px; overflow:hidden; }
  .card{ position:relative; width:1200px; height:630px; background:var(--slate800); color:#fff; text-align:center; box-sizing:border-box; padding:46px 60px 0; overflow:hidden; }
  .card::after{ content:""; position:absolute; inset:0; background:radial-gradient(120% 90% at 50% -10%, rgba(124,58,237,.38), transparent 60%); pointer-events:none; }  /* TODO: the essay's accent, as rgba */
  .kicker{ font-family:var(--sans); letter-spacing:.22em; text-transform:uppercase; font-size:15px; color:var(--accent300); font-weight:700; position:relative; }
  h1{ color:#fff; font-size:64px; margin:10px auto 4px; line-height:1.06; max-width:18ch; position:relative; border:none; }
  .sub{ color:var(--slate200); font-size:22px; max-width:48ch; margin:14px auto 0; line-height:1.4; position:relative; }
  .glyph{ display:block; margin:22px auto 0; width:560px; height:auto; position:relative; }
  .byline{ color:var(--grayout); font-family:var(--sans); font-size:18px; margin-top:16px; position:relative; }
  .glyph text{ font-family:var(--sans); }
</style></head>
<body>
<!-- the shared arrowhead markers the hero glyph references (copy the page's <defs> block) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <marker id="ah-accent-lt" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/></marker>
</defs></svg>
<div class="card">
  <div class="kicker">A visual essay</div>
  <h1>TODO Title</h1>
  <p class="sub">TODO one- or two-sentence subtitle, shortened from the hero's if it would wrap past three lines.</p>
  __HERO_SVG__
  <p class="byline">Jasper Gilley &nbsp;&middot;&nbsp; Independent researcher</p>
</div>
</body></html>
